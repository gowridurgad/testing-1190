name: testing mise

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
  
      
      - uses: gowridurgad/setup-node@mise-testing
        with:
          node-version-file: 'mise.toml'
      - name: Verify
        shell: bash
        run: |
          node --version
          
      - run: npm install
