name: testing mise

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:      
      - uses: actions/checkout@v7
      - uses:  gperdomor/setup-node@feature/mise-support  
        with:
          node-version-file: package.json
          node-version: 22
      - name: Verify
        shell: bash
        run: |
          node --version
          
    
