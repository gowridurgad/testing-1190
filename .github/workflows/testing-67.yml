name: test npmrc-lines

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node with npmrc-lines
        uses: gowridurgad/setup-node@scope-67
        with:
          node-version: 24
          npmrc-lines: |
            @gowridurgad:registry=https://npm.pkg.github.com/
            //npm.pkg.github.com/:_authToken=${GH_TOKEN}
            @gowri48:registry=https://registry.npmjs.org/
            //registry.npmjs.org/:_authToken=${NPMJS_TOKEN}
        env:
          GH_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          NPMJS_TOKEN: ${{ secrets.NPMJS_TOKEN }}

      - name: Show generated .npmrc
        run: |
          echo "NPM_CONFIG_USERCONFIG=$NPM_CONFIG_USERCONFIG"
          echo "----- .npmrc contents -----"
          cat "$NPM_CONFIG_USERCONFIG"

      - name: Install dependencies
        run: npm install
        env:
          GH_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          NPMJS_TOKEN: ${{ secrets.NPMJS_TOKEN }}

      - name: Publish @gowridurgad/pkg-x to GitHub Packages
        run: npm publish --workspace=@gowridurgad/pkg-x
        env:
          GH_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          NPMJS_TOKEN: ${{ secrets.NPMJS_TOKEN }}

      - name: Publish @gowri48/pkg-y to npmjs
        run: npm publish --workspace=@gowri48/pkg-y
        env:
          GH_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          NPMJS_TOKEN: ${{ secrets.NPMJS_TOKEN }}
