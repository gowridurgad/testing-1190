name: test 67-2 publish-all

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show original package.json name
        run: node -p "require('./package.json').name"

      - name: Setup Node (multi-registry)
        uses: gowridurgad/setup-node@67-2
        with:
          node-version: '24'
          npm-registries: |
           
            @gowri48=https://registry.npmjs.org/::${NPMJS_TOKEN}
            @gowridurgad=https://npm.pkg.github.com/::${GH_TOKEN}
        env:
          GH_TOKEN:    ${{ secrets.GH_TOKEN }}
          NPMJS_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Show generated files
        run: |
          echo "----- .npmrc -----"
          cat "$NPM_CONFIG_USERCONFIG"
          echo ""
          echo "----- \$NPM_PUBLISH_ALL script -----"
          echo "path: $NPM_PUBLISH_ALL"
          cat "$NPM_PUBLISH_ALL"
          echo ""
          echo "----- package.json name after setup -----"
          node -p "require('./package.json').name"

      - name: Install
        run: npm install

      - name: Publish to ALL registries in one step
        run: $NPM_PUBLISH_ALL --access public
        env:
          GH_TOKEN:    ${{ secrets.GH_TOKEN }}
          NPMJS_TOKEN: ${{ secrets.NPM_TOKEN }}
