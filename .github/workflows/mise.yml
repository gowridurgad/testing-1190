name: Smoke test — mise.toml support

on:
  workflow_dispatch:
  

jobs:
  # 1. Basic string form
  mise-string:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Create mise.toml
        shell: bash
        run: |
          cat > mise.toml <<'EOF'
          [tools]
          node = "24"
          EOF
      - uses: gowridurgad/setup-node@mise-testing
        with:
          node-version-file: 'mise.toml'
      - name: Verify
        shell: bash
        run: |
          node --version
          node --version | grep -q '^v24\.' || { echo "FAIL: expected v24.x"; exit 1; }
          echo "PASS"

  # 2. Object form
  mise-object:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Create mise.toml
        shell: bash
        run: |
          cat > mise.toml <<'EOF'
          [tools]
          node = { version = "22" }
          EOF
      - uses: gowridurgad/setup-node@mise-testing
        with:
          node-version-file: 'mise.toml'
      - name: Verify
        shell: bash
        run: |
          node --version | grep -q '^v22\.' || { echo "FAIL: expected v22.x"; exit 1; }
          echo "PASS"

  # 3. Table form [tools.node]
  mise-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create mise.toml
        shell: bash
        run: |
          cat > mise.toml <<'EOF'
          [tools.node]
          version = "20"
          EOF
      - uses: gowridurgad/setup-node@mise-testing
        with:
          node-version-file: 'mise.toml'
      - name: Verify
        run: node --version | grep -q '^v20\.'

  # 4. Multi-tool file (only node line should be picked)
  mise-multitool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create mise.toml
        shell: bash
        run: |
          cat > mise.toml <<'EOF'
          [tools]
          go = "latest"
          python = "3.12"
          node = "22.12"
          EOF
      - uses: gowridurgad/setup-node@mise-testing
        with:
          node-version-file: 'mise.toml'
      - name: Verify
        run: node --version | grep -q '^v22\.12'

  # 5. Exact version pin
  mise-exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create mise.toml
        shell: bash
        run: |
          cat > mise.toml <<'EOF'
          [tools]
          node = "22.12.0"
          EOF
      - uses: gowridurgad/setup-node@mise-testing
        with:
          node-version-file: 'mise.toml'
      - name: Verify
        run: |
          [ "$(node --version)" = "v22.12.0" ] || { echo "FAIL"; exit 1; }

  # 6. Negative test — object without version should fail cleanly
  mise-object-no-version:
    runs-on: ubuntu-latest
    continue-on-error: true  # expected to fail
    steps:
      - uses: actions/checkout@v5
      - name: Create mise.toml
        shell: bash
        run: |
          cat > mise.toml <<'EOF'
          [tools]
          node = { postinstall = "corepack enable" }
          EOF
      - id: setup
        continue-on-error: true
        uses: gowridurgad/setup-node@mise-testing
        with:
          node-version-file: 'mise.toml'
      - name: Verify failure
        if: steps.setup.outcome == 'success'
        run: echo "FAIL: should have errored" && exit 1

  # 7. Cache-hit smoke (ensure cache flow still works with mise.toml)
  mise-with-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create mise.toml + package.json + lockfile
        shell: bash
        run: |
          cat > mise.toml <<'EOF'
          [tools]
          node = "22"
          EOF
          cat > package.json <<'EOF'
          { "name": "smoke", "version": "1.0.0", "dependencies": { "lodash": "^4" } }
          EOF
          npm install --package-lock-only
      - uses: gowridurgad/setup-node@mise-testing
        with:
          node-version-file: 'mise.toml'
          cache: 'npm'
      - name: Verify
        run: node --version | grep -q '^v22\.'
