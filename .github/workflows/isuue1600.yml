name: Reproduce/fix node-gyp on Windows

on:
  workflow_dispatch:

jobs:
  repro:
    runs-on: windows-latest
    env:
      GYP_MSVS_VERSION: "2022"


    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1


      - name: Install dependencies
        run:  npm install
         
