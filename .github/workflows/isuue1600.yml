name: Reproduce node-gyp Visual Studio detection failure

on:
  workflow_dispatch:

jobs:
  repro:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1

      - name: Show environment
        shell: pwsh
        run: |
          node -v
          npm -v
          python --version
          if (Test-Path "C:\Program Files\Microsoft Visual Studio") {
            Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Depth 2 | Select-Object FullName
          }


      - name: Install dependencies
        run: npm install
