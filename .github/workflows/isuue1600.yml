name: Compare node-gyp behavior on Windows runners

on:
  workflow_dispatch:

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Show environment
        shell: pwsh
        run: |
          echo "Runner: ${{ matrix.os }}"
          node -v
          npm -v
          python --version
          if (Test-Path "C:\Program Files\Microsoft Visual Studio") {
            Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Depth 2 | Select-Object FullName
          }

      - name: Install
        run: npm install
