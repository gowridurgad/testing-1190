name: Compare node-gyp behavior on Windows runners

on:
  workflow_dispatch:

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Show environment
        shell: pwsh
        run: |
          echo "Runner: ${{ matrix.os }}"
          node -v
          npm -v
          python --version
          if (Test-Path "C:\Program Files\Microsoft Visual Studio") {
            Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Depth 2 | Select-Object FullName
          }

      - name: Create repro package
        shell: pwsh
        run: |
          @'
          {
            "name": "node-gyp-repro",
            "private": true,
            "version": "1.0.0",
            "dependencies": {
              "os-service": "1.4.1"
            }
          }
          '@ | Out-File -FilePath package.json -Encoding utf8

      - name: Install
        shell: pwsh
        run: |
          $env:npm_config_loglevel="silly"
          npm install
